name: Dependabot auto-merge
on: pull_request_target

permissions:
  pull-requests: write
  # Required by enablePullRequestAutoMerge (what `gh pr merge --auto` calls).
  # Dropping it fails the job with "Resource not accessible by integration".
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      # A push made with GITHUB_TOKEN triggers no workflows, and auto-merge is
      # attributed to whoever enabled it -- so merging with GITHUB_TOKEN landed
      # dependabot commits on main with zero CI runs and no release. Enable
      # auto-merge as the release App instead, so the merge push starts CI.
      - name: Generate release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
