name: Release check

# Nothing on this repo asserted "main == published", so separate incidents left
# main unreleased, or released incompletely, while every check on GitHub looked
# green: 1.29.22 was computed but PSR lost the push race, and the follow-up
# merge that would have retried it ran no workflow at all; v1.29.21 published
# its sdist and one wheel and then lost the whole `build_wheels` matrix. Both
# are invisible from run conclusions alone -- the release path fails after, or
# instead of, the checks that report status.
#
# This asserts the three properties directly:
#   1. main has no releasable commits that PSR has not turned into a version.
#   2. the newest released version actually exists on PyPI.
#   3. that version carries every artifact family ci.yml is meant to build --
#      "the version resolves" is satisfied by the sdist alone.

on:
  schedule:
    # Daily; a backstop for anything the post-CI run below misses.
    - cron: "17 6 * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  released:
    name: main is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PSR needs the full history and all tags to work out both versions.
          fetch-depth: 0
          ref: main
      # Same pinned action as ci.yml's release job, so the verdict comes from
      # the exact tool that cuts releases. --noop suppresses the commit/tag/push
      # but still reports the version decision through the outputs.
      - name: Determine the release state of main
        id: psr
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ github.token }}
          no_operation_mode: true

      - name: Check main has no unreleased changes
        if: steps.psr.outputs.released == 'true'
        env:
          CURRENT: ${{ steps.psr.outputs.previous_version }}
          PENDING: ${{ steps.psr.outputs.version }}
        run: |
          echo "::error::main has unreleased changes: $CURRENT released, $PENDING pending. Run the CI workflow against main (workflow_dispatch) to cut it."
          exit 1

      # With nothing releasable, PSR reports the current version -- which is what
      # the last release published, so it is the version that must exist on PyPI
      # with a complete set of artifacts.
      - name: Check the released version is complete on PyPI
        env:
          VERSION: ${{ steps.psr.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::PSR reported no version for main."
            exit 1
          fi
          url="https://pypi.org/pypi/bluetooth-data-tools/${VERSION}/json"
          if ! meta=$(curl -sfL "$url"); then
            echo "::error::Version $VERSION is tagged but absent from PyPI -- the publish leg of its release failed."
            exit 1
          fi
          # The `release` job publishes the sdist and its own runner's wheel
          # before `build_wheels` starts, so reaching this line only proves the
          # version resolves. Assert the wheel matrix actually landed too.
          if ! echo "$meta" | jq -r '.urls[].filename' \
              | scripts/check_release_artifacts.sh; then
            echo "::error::Version $VERSION is on PyPI but incomplete -- upload_pypi did not publish the full wheel matrix. Re-run the CI workflow against main (workflow_dispatch) once the failing wheel target is fixed."
            exit 1
          fi
          echo "$VERSION is complete on PyPI."
